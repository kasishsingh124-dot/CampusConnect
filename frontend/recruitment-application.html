<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Club Recruitment | CampusConnect</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header class="navbar">

        <div class="logo">
            CampusConnect
        </div>

        <nav>

            <a href="index.html">Home</a>

            <a href="index.html#clubs">Clubs</a>

            <a href="events.html">Events</a>

            <a href="recruitment.html">Recruitment</a>

        </nav>

    </header>


    <main>

        <section class="application-section">

            <div class="application-card">

                <h1>
                    Club Recruitment Application
                </h1>

                <p id="club-name">
                    Loading club...
                </p>


                <form id="application-form">


                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        required
                    >


                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        required
                    >


                    <label for="course">
                        Course
                    </label>

                    <input
                        type="text"
                        id="course"
                        placeholder="e.g. B.Tech CSE"
                        required
                    >


                    <label for="year">
                        Year
                    </label>

                    <select id="year" required>

                        <option value="">
                            Select Year
                        </option>

                        <option value="1st Year">
                            1st Year
                        </option>

                        <option value="2nd Year">
                            2nd Year
                        </option>

                        <option value="3rd Year">
                            3rd Year
                        </option>

                        <option value="4th Year">
                            4th Year
                        </option>

                    </select>


                    <label for="skills">
                        Skills
                    </label>

                    <textarea
                        id="skills"
                        placeholder="e.g. JavaScript, Photography, Video Editing..."
                        required>
                    </textarea>


                    <label for="reason">
                        Why do you want to join this club?
                    </label>

                    <textarea
                        id="reason"
                        placeholder="Tell us why you want to join..."
                        required>
                    </textarea>


                    <button type="submit">
                        Submit Application
                    </button>

                </form>


                <p id="application-message"></p>


                <a href="recruitment.html">
                    ← Back to Recruitment
                </a>

            </div>

        </section>

    </main>


    <script src="js/recruitment-application.js"></script>

</body>

</html>
