<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login | CampusConnect</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <main class="registration-section">

        <div class="registration-card">

            <h1>
                🎓 Student Login
            </h1>

            <p>
                Login to explore CampusConnect.
            </p>


            <form id="student-login-form">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p id="login-message"></p>


            <br>

            <a href="portal.html">
                ← Back
            </a>

        </div>

    </main>


    <script src="js/student-login.js"></script>

</body>

</html>
